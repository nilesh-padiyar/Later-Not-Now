
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Later, Not Now</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="container">

    <header>
        <h2><i>Later, Not Now</i></h2>
        <p>A place to capture your thoughts before they disappear.</p>
        <p>Save it now. Thank yourself later.</p>
    </header>

    <section>
        <h4><i>Have a thought, Save it!</i></h4>
        <p><i>(for now or later)</i></p>
    </section>

    <div id="controls">
        <button id="button1">A Thought 💭</button>
        <button id="button2">An Idea 💡</button>
        <button id="button3">A Task or Goal 🎯</button>
    </div>

    <div id="inputContainer" style="display:none;">
        <textarea id="noteInput" rows="3" placeholder="Type here..."></textarea>
        <div class="action-buttons">
            <button id="saveNoteBtn" class="save">Save</button>
            <button id="cancelBtn" class="cancel">Cancel</button>
        </div>
    </div>

    <h4><i>Your saved thoughts, ideas and tasks/goals -</i></h4>
    <hr>

    <div id="searchContainer">
        <input type="text" id="searchInput" placeholder="Search notes...">
        <select id="sortOrder">
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
        </select>
    </div>

    <div id="notesList"></div>

    <div class="import-export">
        <button id="exportBtn">Export Data (JSON)</button>
        <button id="importBtn">Import Data</button>
        <input type="file" id="fileInput" hidden accept=".json">
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
